name: Deploy to Cloudflare Workers

on:
  # 手动触发部署
  workflow_dispatch:

  # 上游同步工作流完成后触发检查
  workflow_run:
    workflows: ["Upstream Sync"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      deploy_ref: ${{ steps.decide.outputs.deploy_ref }}

    steps:
      - name: Check whether deployment is needed
        id: decide
        uses: actions/github-script@v7
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        with:
          script: |
            core.setOutput('should_deploy', 'false');

            // 保留原有逻辑：手动运行允许部署，
            // 自动运行需要配置 CF_ACCOUNT_ID。
            if (!process.env.CF_ACCOUNT_ID &&
                context.eventName !== 'workflow_dispatch') {
              core.info('未配置 CF_ACCOUNT_ID，跳过部署');
              return;
            }

            let deployRef = context.sha;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;

              if (run.conclusion !== 'success') {
                core.info('上游同步未成功，跳过部署');
                return;
              }

              const { data } = await github.rest.repos.getBranch({
                ...context.repo,
                branch: 'main'
              });

              // 同步工作流启动时的提交号，与同步完成后的 main 比较。
              if (data.commit.sha === run.head_sha) {
                core.info('没有新更新，跳过部署');
                return;
              }

              deployRef = data.commit.sha;
            }

            core.setOutput('deploy_ref', deployRef);
            core.setOutput('should_deploy', 'true');
            core.info(`准备部署提交：${deployRef}`);

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.deploy_ref }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      - name: 📝 Create wrangler.toml
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "server-monitor-pro"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          # 定时任务配置（UTC）
          # 每分钟：执行离线节点检测
          # 每小时：执行其他定时任务
          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          [vars]
          API_SECRET = "SECRET_PLACEHOLDER"
          API_USER_NAME = "USER_NAME_PLACEHOLDER"
          CORS_ALLOWED_ORIGINS = "CORS_ORIGINS_PLACEHOLDER"
          WEOF

          sed -i "s|D1_PLACEHOLDER|${{ secrets.D1_DATABASE_ID }}|g" wrangler.toml
          sed -i "s|SECRET_PLACEHOLDER|${{ secrets.API_SECRET }}|g" wrangler.toml
          sed -i "s|USER_NAME_PLACEHOLDER|${{ secrets.API_USER_NAME }}|g" wrangler.toml
          sed -i "s|CORS_ORIGINS_PLACEHOLDER|${{ secrets.CORS_ALLOWED_ORIGINS }}|g" wrangler.toml

          echo "✅ wrangler.toml 已生成"

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: ✅ Deployment Success
        if: success()
        run: echo "🎉 部署成功！"

      - name: ❌ Deployment Failed
        if: failure()
        run: echo "💥 部署失败！请检查 Actions 日志"
